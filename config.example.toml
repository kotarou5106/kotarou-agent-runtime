# =============================================================================
# 必填：LLM 配置
# api_key 可以直接填字符串，也可以用 ${ENV_VAR} 引用环境变量。
# =============================================================================

[llm]
provider = "deepseek"

[llm.main]
# 主模型，必填。推荐 deepseek-v4-flash（agent 能力强、价格低）。
model = "deepseek-v4-flash"
api_key = "sk-..."
base_url = "https://api.deepseek.com/v1"
enable_thinking = true
multimodal = false

[llm.fast]
# 轻量模型，用于 memory gate / query rewrite / HyDE。
# 不填则退回主模型，但延迟会稍高。
model = "qwen-flash"
api_key = "sk-..."
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"

[llm.vl]
# 视觉模型，仅在 llm.main.multimodal = false 时需要。
# model 留空则不启用，图片会作为路径传给主模型。
model = "qwen-vl-plus"
api_key = "sk-..."
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"

# =============================================================================
# Agent 行为
# =============================================================================

[agent]
system_prompt = "You are Kotarou, a helpful AI assistant with access to tools. Always respond in the same language the user uses."
max_tokens = 8192
# 设为 0 表示不限制迭代轮数；长任务仍可用 /stop 中断。
max_iterations = 40
dev_mode = false

[agent.context]
memory_window = 40

[agent.tools]
search_enabled = true

# 可选：工作流编排后端。默认 native；设为 langgraph 后启用 LangGraph
# StateGraph 编排 LLM/tool loop，并支持 checkpoint / interrupt。
[agent.orchestration]
backend = "native"
checkpoint_enabled = true
interrupt_high_risk_tools = true

# 可选：长期记忆整理任务（默认已启用，通常无需修改）
# [agent.maintenance]
# memory_optimizer_enabled = true
# memory_optimizer_interval_seconds = 64800

# 可选：控制加载哪些工具集（默认值适合大多数场景）
# [agent.wiring]
# toolsets = ["meta_common", "spawn", "schedule", "mcp"]

# =============================================================================
# 必填：至少配置一个频道（Telegram 或 QQ 选其一）
# token / bot_uin 为空时该频道自动跳过，不会报错。
# =============================================================================

[channels.telegram]
# BotFather 给的 bot token，格式：123456789:AAF...
token = ""
# 你的 Telegram 用户名（不带 @），只有白名单用户才能使用 bot。
allow_from = ["your_username"]
# 默认等完整回答生成后一次性发送；调试时才建议开启下面三项。
live_edit = false
stream_response = false
show_thinking = false
# channel 标识符，决定 session key 前缀（如 telegram:12345）。
# 多个 bot 想要隔离记忆时，改成不同的名字（如 "telegram_work"）。
# channel_name = "telegram"

[channels.qq]
# 填 QQ 号启用 QQ 频道，留空跳过。
bot_uin = ""
allow_from = ["your_qq_number"]
websocket_open_timeout_seconds = 5.0

# 可选：允许在群组中使用（@bot 触发）
# [[channels.qq.groups]]
# group_id = "123456789"
# allow_from = ["your_qq_number"]
# require_at = true

[channels.qqbot]
# 官方 QQBot，和 NapCat QQ 通道并存。留空跳过。
app_id = ""
client_secret = ""
# 私聊白名单使用官方 user_openid。
allow_from = []

# 当前实现仅启用私聊；群配置先保留为后续扩展占位。
# [[channels.qqbot.groups]]
# group_openid = "GROUP_OPENID"
# allow_from = ["MEMBER_OPENID"]
# require_at = true
# allow_proactive = false

# =============================================================================
# 语义记忆
# default memory 的检索阈值在 plugins/default_memory/config.local.toml。
# =============================================================================

[memory]
enabled = true
# 语义记忆 engine 选择。留空等同 default。
engine = ""

[memory.embedding]
model = "text-embedding-v3"
api_key = "sk-..."
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"

# =============================================================================
# 主动推送（可选）
# 先跑通基本对话再开启这部分。
# =============================================================================

[proactive]
# 开启后 agent 会主动向你推送消息。需要先填好下方 chat_id 再设为 true。
enabled = false
profile = "daily"

[proactive.target]
channel = "telegram"
# 你的 Telegram user id（向 bot 发一条消息后从日志里可以拿到）。
# 官方 QQBot 私聊可填：channel = "qqbot"，chat_id = "c2c:USER_OPENID"
chat_id = "YOUR_TELEGRAM_CHAT_ID"

[proactive.agent]
max_steps = 35
content_limit = 5
web_fetch_max_chars = 8000
context_prob = 0.03
delivery_cooldown_hours = 1

[proactive.drift]
# Drift：无可推送内容时 agent 自主做任务。建议先跑通 proactive 再开启。
enabled = false
max_steps = 20
min_interval_hours = 3

[proactive.telegram_job_monitor]
enabled = false
schedule = "06:00"
timezone = "Asia/Shanghai"
target_chat_id = "${TELEGRAM_TARGET_CHAT_ID}"
read_limit = 50
debug = false

[telegram_daily_summary]
enabled = false
time = "06:00"
timezone = "Asia/Shanghai"
lookback_hours = 24
send_to = "me"
target_chat_id = "YOUR_TELEGRAM_CHAT_ID"
max_messages_per_target = 500
include_original_links = true
summary_targets = [
  { chat_title = "Web3万事屋（招聘&求职&资源分享）", chat_id = -1002535833398, topic_id = 6631, expected_topic_title = "吃瓜闲聊-禁发招聘" },
]
summary_targets = [
  { chat_title = "Web3万事屋（招聘&求职&资源分享）", chat_id = -1002535833398, topic_id = 6631, expected_topic_title = "吃瓜闲聊-禁发招聘" },
]

[morning_greeting]
enabled = false
time = "06:05"
timezone = "Asia/Shanghai"
send_to = "me"
target_chat_id = "YOUR_TELEGRAM_CHAT_ID"
avoid_recent_days = 14
style_pool = [
  "Foucault",
  "Derrida",
  "Deleuze",
  "Barthes",
  "Blanchot",
  "Kafka",
  "Borges",
  "Calvino",
  "Beckett",
]

[telegram_audio_collector]
enabled = false
time = "06:10"
timezone = "Asia/Shanghai"
lookback_hours = 24
send_to = "me"
target_chat_id = "YOUR_TELEGRAM_CHAT_ID"
download_audio = true
audio_download_dir = "data/telegram_audio_collector"
include_original_links = true
max_messages_per_target = 500
audio_targets = [
  { chat_title = "群聊1", chat_id = "${TELEGRAM_AUDIO_GROUP_1_ID}", topic_id = 13017 },
  { chat_title = "群聊2", chat_id = "${TELEGRAM_AUDIO_GROUP_2_ID}", topic_id = 265 },
  { chat_title = "群聊3", chat_id = "${TELEGRAM_AUDIO_GROUP_3_ID}", topic_id = 389 },
]
keywords = ["妈妈", "儿子", "继母", "母子", "小妈", "母亲", "妈咪", "熟母"]
exclude_keywords = ["未成年", "幼", "小学生", "初中", "高中", "偷拍", "强迫", "迷奸", "未同意"]

# =============================================================================
# 其他集成（可选）
# =============================================================================

[integrations.fitbit]
enabled = false

