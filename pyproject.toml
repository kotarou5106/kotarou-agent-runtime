[project]
name = "kotarou-agent"
version = "0.1.0"
requires-python = ">=3.12"

[project.optional-dependencies]
dpo = [
    "accelerate>=1.12.0",
    "datasets>=4.4.0",
    "peft>=0.18.0",
    "torch>=2.9.0",
    "transformers>=4.57.0",
    "trl>=0.26.0",
]

[tool.black]
line-length = 88
target-version = ["py314"]
include = '\.pyi?$'

[dependency-groups]
dev = [
    "rich>=15.0.0",
]
